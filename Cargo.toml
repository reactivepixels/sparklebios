[package]
name = "sparklebios"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A 1995 POST screen for your terminal that is secretly a health check"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reactivepixels/sparklebios"
readme = "README.md"
keywords = ["terminal", "cli", "retro", "bios", "motd"]
categories = ["command-line-utilities"]
# Only what the binary needs at build time (the include_str!/include_bytes!
# targets in src/) plus the licence and paperwork files, so the tarball on
# crates.io does not carry docs/assets/ (several megabytes of PNGs and a GIF
# that the crate never reads).
include = [
    "src/**",
    "machines/**",
    "flavours/**",
    "sprites/**",
    "themes/**",
    "shell/**",
    "extras/**",
    "/Cargo.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/CHANGELOG.md",
]

[[bin]]
name = "bios"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
