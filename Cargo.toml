[package]
name = "sparklebios"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A 1995 POST screen for your terminal that is secretly a health check"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reactivepixels/sparklebios"
readme = "README.md"
keywords = ["terminal", "cli", "retro", "bios", "motd"]
categories = ["command-line-utilities"]

[[bin]]
name = "bios"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
