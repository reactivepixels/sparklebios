id = "pc95"
name = "Mid-90s PC POST"
cols = 80
fg = "#AAAAAA"
bright = "#FFFFFF"
accent = "#FFFF55"
paint = true
pad_x = 2
pad_y = 1
flavoured = true
detect_width = 27

[[step]]
print = "{flavour.firmware}"
style = "bright"

[[step]]
print = "{flavour.vendor}"
style = "bright"

[[step]]
print = ""

[[step]]
print = "{flavour.board}"

[[step]]
print = ""

[[step]]
print = "Main Processor : {cpu.name}, {cpu.cores} cores, {flavour.cpu_gag}"
ms = 120

[[step]]
count = "Memory Testing : {n}K"
to = "{mem.kb}"
suffix = " OK"
ms = 600

[[step]]
print = ""

[[step]]
detect = "Detecting Primary Master   "
result = "{disk.size_gb}GB, {disk.used_pct}% used"

[[step]]
detect = "Detecting Operating System "
result = "{os.name} {os.version}"

[[step]]
detect = "Detecting Shell            "
result = "{shell.name}"

[[step]]
detect = "Detecting {flavour.part}"
result = "{flavour.part_result}"

[[step]]
print = ""

[[step]]
findings = true

[[step]]
print = ""

[[step]]
quip = true

[[step]]
print = ""

[[step]]
print = "{flavour.streak}"
ms = 200

[[step]]
print = "Shell boot time: {shell.boot_ms}ms"

[[step]]
print = ""

[[step]]
f1 = true

[[step]]
print = "{date.bios}-{flavour.footer}"

[findings]
boot_order = "Boot device order: {boot.devices}"
boot_dirty = "Primary boot device not parked: {boot.device}, {boot.changes}."
irq_conflict = "IRQ conflict: port {irq.port} held by {irq.name} (pid {irq.pid}) for {irq.age}."
virus_one = "Virus scan: {virus.repo} has {virus.file} tracked by git. Quarantine advised."
virus_many = "Virus scan: {virus.count} tracked secrets in {virus.repo}, including {virus.file}."
disk_trend = "Primary Master filling: full in about {disk.days_left} at {disk.rate}."
battery_health = "CMOS battery worn: {battery.health} of design capacity after {battery.cycles} cycles."
stale_stashes = "NVRAM: {stash.count} in {stash.repo}, the oldest {stash.age} old."
dotfiles_changed = "CMOS checksum error: {dotfiles.changes} in {dotfiles.repo}."
runtime_drift = "Option ROM mismatch: {runtime.repo} wants {runtime.name} {runtime.wanted}, found {runtime.found}."
f1 = "Press F1 to continue."
f1_resume = "Press F1 to continue, or bios resume to boot {boot.device}."

[[calendar]]
text = "Year {date.year} rollover complete. Nothing caught fire. Again."
month = 1
day = 1

[[calendar]]
text = "Y2038 check: {y2038.days} days until 32-bit time runs out. Noted."
month = 1
day = 19

[[calendar]]
text = "Leap day detected. The calendar chip has been dreading this."
month = 2
day = 29

[[calendar]]
text = "Pi Day. Math coprocessor reports 3.14159 and refuses to stop."
month = 3
day = 14

[[calendar]]
text = "World Backup Day. The BIOS asks only that you think about it."
month = 3
day = 31

[[calendar]]
text = "No jokes today. The BIOS does not trust anyone."
month = 4
day = 1

[[calendar]]
text = "Force detected: not found. Proceeding on ordinary electricity."
month = 5
day = 4

[[calendar]]
text = "Day 256 of the year. The day counter did not overflow. This time."
day_of_year = 256

[[calendar]]
text = "Friday the 13th. Booting anyway, against advice."
weekday = "friday"
day = 13

[[calendar]]
text = "Ghost processes are checked for every day. Today it just feels right."
month = 10
day = 31

[[calendar]]
text = "Holiday boot. Nobody is watching the build. Go outside."
month = 12
day = 25

[[calendar]]
text = "Last boot of {date.year}? Real-time clock standing by."
month = 12
day = 31
