# A starship palette to match the "Rainbows and Unicorns" Ghostty theme.
#
# Written for starship's Gruvbox Rainbow preset, which names its colours rather
# than hard-coding them. Paste this table at the end of ~/.config/starship.toml,
# then change the preset's `palette = 'gruvbox_dark'` line to:
#
#   palette = 'rainbows_and_unicorns'
#
# The segments then run orange, yellow, green, blue, purple: the stripes, in order.

[palettes.rainbows_and_unicorns]
color_fg0 = '#fffdf5'
color_bg1 = '#23232d'
color_bg3 = '#7a3a7c'
color_blue = '#1479be'
color_aqua = '#3e9a2c'
color_green = '#62bb47'
color_orange = '#d9650f'
color_purple = '#bb62c0'
color_red = '#e0453f'
color_yellow = '#c08a00'

# The same, for the Mane variant of the theme: the unicorn's own colours.
#   palette = 'rainbows_and_unicorns_mane'

[palettes.rainbows_and_unicorns_mane]
color_fg0 = '#ffffff'
color_bg1 = '#24222e'
color_bg3 = '#7a2a90'
color_blue = '#2478c4'
color_aqua = '#3f9a2a'
color_green = '#68c44a'
color_orange = '#d9620f'
color_purple = '#b866d6'
color_red = '#eb413a'
color_yellow = '#bf8a00'

# The one that follows any theme. Instead of hex values it names the terminal's
# own sixteen colours by number, so the prompt changes whenever the theme does,
# and works with all nine variants. This is the one to use.
#   palette = 'rainbows_and_unicorns_auto'
#
# 9 is bright red, which carries the orange stripe in every variant of the theme.

# Text on the segments is the theme's black (0), which reads on saturated and
# pastel variants alike; white text washes out on Workbench and Miami.
[palettes.rainbows_and_unicorns_auto]
color_fg0 = '0'
color_bg1 = '8'
color_bg3 = '7'
color_blue = '4'
color_aqua = '2'
color_green = '10'
color_orange = '9'
color_purple = '5'
color_red = '1'
color_yellow = '3'

# Paper White is the one exception. Its colours are dark inks, made for text on a
# light page, so as segment backgrounds they need white text, not black.
#   palette = 'rainbows_and_unicorns_paper'

[palettes.rainbows_and_unicorns_paper]
color_fg0 = '15'
color_bg1 = '8'
color_bg3 = '7'
color_blue = '4'
color_aqua = '2'
color_green = '10'
color_orange = '9'
color_purple = '5'
color_red = '1'
color_yellow = '3'
