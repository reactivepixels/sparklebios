name: Add my childhood mascot
description: Propose a new flavour. Accuracy is the whole joke.
title: "[flavour] "
labels: ["new-flavour"]
body:
  - type: markdown
    attributes:
      value: |
        A flavour is one TOML file (see `docs/flavours.md`). What we need most is an
        accurate record of the one part a BIOS should detect, so the one changed word
        lands. Read `docs/voice.md` before proposing any wording.
  - type: input
    id: flavour
    attributes:
      label: The flavour, in descriptive terms
      description: A creature or object, for example "a golden retriever" or "a cassette tape".
    validations:
      required: true
  - type: input
    id: year
    attributes:
      label: Year
    validations:
      required: true
  - type: input
    id: part
    attributes:
      label: The one part a BIOS should detect
      description: For the unicorn it is the horn. What is it for yours, and what does the BIOS report about it?
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Reference
      description: A photo, an emulator screenshot, or a link to documentation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposed wording (optional)
      description: Which word would you change, and to what?
      render: text
  - type: checkboxes
    id: rules
    attributes:
      label: House rules
      options:
        - label: The wording will be original. No real logos, wordmarks or copied copyright strings.
          required: true
        - label: I would like to write the TOML myself.
