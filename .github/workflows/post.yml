# POST: power-on self test. Every push boots the project and checks it over.
name: POST

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: post-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    name: Self test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  speed-receipt:
    name: Speed receipt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build release
        run: cargo build --release
      - name: Speed receipt
        run: |
          python3 tools/speed_receipt.py target/release/bios \
            --runner "${{ matrix.os }}" \
            --summary "$GITHUB_STEP_SUMMARY"

  house-rules:
    name: House rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: No em dashes or en dashes anywhere
        run: |
          if grep -rnIP '[\x{2014}\x{2013}]' --exclude-dir=.git --exclude-dir=target --exclude=LICENSE-APACHE .; then
            echo "Found an em dash or en dash. Use a comma, a colon, parentheses, or two sentences."
            exit 1
          fi
      - name: Licences, advisories and the no-network rule
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
