# Release: builds the bios binary for four targets. A tag push (v*) attaches
# the tarballs and SHA256SUMS to the GitHub release for that tag. Running it
# by hand (workflow_dispatch) builds the same artifacts and leaves them on the
# workflow run only, it never creates or touches a release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  version:
    name: Work out the version string
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: From the tag, or a dev label for a manual run
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners where GitHub has one. The Intel macOS runner label
          # macos-13 no longer picks up a machine, so the x86_64 Mac build is
          # cross compiled on the Apple Silicon runner, which its toolchain
          # handles. Verified by a manual run of this workflow.
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package the tarball
        id: package
        run: |
          STAGE="bios-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/bios" "$STAGE/"
          cp README.md CHANGELOG.md LICENSE-APACHE LICENSE-MIT "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"
          echo "name=$STAGE.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bios-${{ needs.version.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Sum every tarball
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [version, build, checksums]
    # This is the only job allowed to touch a release, and only for the push
    # that created the tag. A workflow_dispatch run never reaches this job.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bios-${{ needs.version.outputs.version }}-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SHA256SUMS
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  publish-crate:
    name: Publish to crates.io
    needs: [version, build, release]
    # This runs last, and only once the GitHub release for the tag is
    # actually live, because publishing a crate cannot be undone. If build or
    # release failed or was skipped, this job is skipped too.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing exchanges this OIDC token for a short lived
      # crates.io token, there is no stored registry secret to leak.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Trade the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
